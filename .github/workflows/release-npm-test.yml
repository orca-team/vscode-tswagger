name: Release Npm Packages Test

on:
  pull_request:
    branches:
      - master
    paths:
      - '.changeset/**'
      - 'packages/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Npm Package Release Flow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_VERSION_PR_BRANCH: 'changeset-release/master'
      NPM_VERSION_PR_TITLE: 'chore: version npm packages'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Npm Release Scope
        id: npm_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          should_validate="true"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            should_validate="false"
            while IFS= read -r file; do
              if [[ "$file" == .changeset/* || "$file" == packages/* ]]; then
                should_validate="true"
                break
              fi
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "should_validate=$should_validate" >> "$GITHUB_OUTPUT"
      - name: Note Skipped Npm Validation
        if: ${{ steps.npm_scope.outputs.should_validate != 'true' }}
        run: echo "Skipping npm package release validation because this PR does not touch .changeset/** or packages/**."
      - name: Setup Node
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install pnpm
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        run: npm install -g pnpm@9
      - name: Install Dependencies
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        run: pnpm install --no-frozen-lockfile
      - name: Detect Npm Version PR
        id: version_pr
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const titlePattern = new RegExp(
            `^${escapeRegExp(process.env.NPM_VERSION_PR_TITLE || '')}(?: \\([^)]+\\))?$`
          );
          const isNpmVersionPr =
            process.env.GITHUB_EVENT_NAME === 'pull_request' &&
            process.env.PR_HEAD_REF === process.env.NPM_VERSION_PR_BRANCH &&
            titlePattern.test(process.env.PR_TITLE || '');

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `is_npm_version_pr=${isNpmVersionPr ? 'true' : 'false'}\n`
          );
          NODE
      - name: Validate Changeset Status
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' && steps.version_pr.outputs.is_npm_version_pr != 'true' }}
        run: pnpm run release:npm:status
      - name: Note Version PR Validation Mode
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' && steps.version_pr.outputs.is_npm_version_pr == 'true' }}
        run: echo "Skipping changeset status because this PR is the maintainer-reviewed npm version PR."
      - name: Build Types
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        run: pnpm --filter @tswagger/types run build
      - name: Build Core
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        run: pnpm --filter @tswagger/core run build
      - name: Test Core
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        run: pnpm --filter @tswagger/core run test-compile && pnpm --filter @tswagger/core run test
      - name: Build CLI
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        run: pnpm --filter @tswagger/cli run build
      - name: Test CLI
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        run: pnpm --filter @tswagger/cli run test
      - name: Pack Checks
        if: ${{ steps.npm_scope.outputs.should_validate == 'true' }}
        run: |
          pnpm --filter @tswagger/types run pack:check
          pnpm --filter @tswagger/core run pack:check
          pnpm --filter @tswagger/cli run pack:check
